services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revisionmaths
      POSTGRES_PASSWORD: revisionmaths
      POSTGRES_DB: revisionmaths
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
